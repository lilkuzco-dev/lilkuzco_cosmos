plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'lilkuzco-cosmos' }

repositories {
	// kinetics-core is published here by `../lilkuzco_kinetics/gradlew :core:publishToMavenLocal`.
	// Cosmos consumes it as a normal library and adds NO physics of its own.
	mavenLocal()
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cosmos" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		gametest {
			inherit client
			vmArg "-Dfabric.client.gametest"
			runDir "build/run-gametest"
		}
	}
}

// The render battery boots a throwaway world under build/run-gametest, and build/ is disposable,
// so the EULA acceptance has to be re-stamped on every run.
tasks.matching { it.name == 'runGametest' }.configureEach {
	doFirst {
		def runDir = file('build/run-gametest')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text =
				"# written by the gametest run config; build/run-gametest is a throwaway dev world\n" +
				"eula=true\n"

		// kinetics is a hard dependency and is not on the dev classpath as a mod, so the client
		// refuses to start without it. build/ is disposable, so it is re-copied every run.
		def mods = new File(runDir, 'mods')
		mods.mkdirs()
		def kinetics = file("${rootDir}/../lilkuzco_kinetics/fabric/build/libs/"
				+ "lilkuzco-kinetics-${kinetics_version}.jar")
		if (!kinetics.exists()) {
			throw new GradleException("the render battery needs ${kinetics}; build kinetics first")
		}
		mods.listFiles()?.each { it.delete() }
		java.nio.file.Files.copy(kinetics.toPath(),
				new File(mods, kinetics.name).toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The motion authority. Compile-time only: at runtime the kinetics mod jar supplies it,
	// which is why fabric.mod.json declares a hard dependency on it.
	compileOnly "dev.lilkuzco:kinetics-core:${project.kinetics_version}"

	// The kinetics Fabric adapter (KineticsMod / KineticsService / MinecraftWorldProbe) ships in
	// the mod jar, not in kinetics-core — core has no Minecraft dependency by design. At runtime
	// the loaded kinetics mod provides these, so compileOnly is exactly right.
	compileOnly files("${rootDir}/../lilkuzco_kinetics/fabric/build/libs/lilkuzco-kinetics-${kinetics_version}.jar")
	testImplementation "dev.lilkuzco:kinetics-core:${project.kinetics_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed", "skipped" }
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:all,-serial']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "${it}_lilkuzco_cosmos" } }
}
